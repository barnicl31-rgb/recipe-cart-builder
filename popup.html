<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Recipe Basket Builder</title>
    <link rel="stylesheet" href="styles.css">
  </head>
  <body>
    <main class="popup">
      <header>
        <h1>Recipe Basket Builder</h1>
        <p>Extract ingredients from the active recipe page.</p>
      </header>

      <section class="connection-bar" aria-label="Swiggy connection">
        <div>
          <span id="swiggyConnectionDot" class="connection-dot" aria-hidden="true"></span>
          <span id="swiggyConnectionText">Checking Swiggy...</span>
        </div>
        <button id="connectSwiggyButton" class="compact-button" type="button" hidden>Connect</button>
        <button id="disconnectSwiggyButton" class="compact-button secondary-button" type="button" hidden>Disconnect</button>
      </section>

      <button id="testInstamartButton" class="secondary-button test-button" type="button" hidden>Test Instamart</button>
      <button id="extractButton" type="button">Extract Ingredients</button>

      <section id="status" class="status" aria-live="polite"></section>
      <section id="results" class="results"></section>
    </main>

    <script src="popup.js"></script>
  </body>
</html>
